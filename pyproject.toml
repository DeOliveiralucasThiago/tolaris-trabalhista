[project]
name = "tolaris-trabalhista"
version = "0.1.0"
description = "Calculadora trabalhista para advogados, com memória de cálculo explicada."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
