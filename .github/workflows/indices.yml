name: Atualizar índices

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 12 * *" # dia 12 de cada mês, depois da divulgação do IPCA

permissions:
  contents: write

jobs:
  indices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python scripts/atualizar_indices.py
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: Gravar no repositório
        run: |
          if [ -z "$(git status --porcelain tolaris/tabelas/indices.json)" ]; then
            echo "Índices sem alteração."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tolaris/tabelas/indices.json
          git commit -m "Atualiza índices do Banco Central"
          git push
